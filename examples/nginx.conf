# Put this inside the nginx server block that protects an upstream.
# Keep the auth service bound to localhost and expose /check only internally.

location = /_simple_auth_check {
    internal;
    proxy_pass http://127.0.0.1:18991/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $scheme://$http_host$request_uri;
}

location @simple_auth_login {
    return 302 https://auth.example.com/login?rd=$scheme://$http_host$request_uri;
}

location / {
    auth_request /_simple_auth_check;
    error_page 401 = @simple_auth_login;

    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
